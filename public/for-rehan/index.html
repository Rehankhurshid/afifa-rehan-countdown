<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#d87558" />
    <title>A sealed letter</title>
    <link rel="icon" href="/Icon-32w.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/Icon-256w.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap"
    />
    <style>
      :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --tap: 44px; --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      img { max-width: 100%; display: block; }
      p { margin: 0; text-wrap: pretty; }
      h1, h2, h3 { margin: 0; text-wrap: balance; }

      /* sealed screen: shown until (and unless) the key in the link opens the letter */
      html.fr-sealed, html.fr-sealed body { background: #d87558; }
      .fr-lock {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; padding: calc(40px + env(safe-area-inset-top)) 32px calc(56px + env(safe-area-inset-bottom)); text-align: center;
        background: #d87558; font-family: "Instrument Serif", Georgia, serif; transition: opacity 700ms var(--ease-out);
      }
      .fr-lock.is-gone { opacity: 0; pointer-events: none; }
      .fr-lock__tex { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; opacity: .5; mix-blend-mode: multiply; pointer-events: none; }
      .fr-lock > *:not(.fr-lock__tex) { position: relative; }
      .fr-seal { width: 112px; height: 112px; }
      .fr-seal circle, .fr-seal path { fill: none; stroke: rgba(255, 188, 171, .7); stroke-width: 1.2; }
      .fr-seal .fr-ticks { stroke-width: 6; stroke-dasharray: 0.8 7.403; transform-origin: 100px 100px; animation: fr-spin 15s linear infinite; }
      @keyframes fr-spin { to { transform: rotate(360deg); } }
      .fr-label { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; line-height: 1.6; letter-spacing: .24em; text-transform: uppercase; color: rgba(255, 188, 171, .55); margin: 0; }
      .fr-title { font-size: clamp(40px, 12vw, 64px); line-height: 1.02; color: #c91b21; font-weight: 400; margin: 0; }
      .fr-line { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 300; font-size: clamp(22px, 6vw, 26px); line-height: 1.35; color: #ffbcab; margin: 0; max-width: 22ch; }
      .fr-lock[data-state="opening"] .fr-when-sealed, .fr-lock[data-state="sealed"] .fr-when-opening { display: none; }

      .fr-cam { display: none; flex-direction: column; align-items: center; gap: 18px; }
      .fr-lock[data-state="sealed"] .fr-cam { display: flex; }
      .fr-lock[data-state="scanning"] .fr-cam { display: flex; }
      .fr-lock[data-state="scanning"] .fr-line { display: none; }
      .fr-lock[data-state="scanning"] .fr-seal { display: none; }
      .fr-lock[data-state="scanning"] .fr-when-opening { display: none; }
      .fr-btn { min-height: var(--tap); padding: 12px 26px; border-radius: 999px; border: 1px solid rgba(255,188,171,.6); background: #c91b21; color: #fff; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
      .fr-btn[hidden] { display: none; }
      .fr-view { width: 220px; height: 220px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,188,171,.7); display: none; background: rgba(0,0,0,.15); }
      .fr-lock[data-state="scanning"] .fr-view { display: block; }
      .fr-view video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      .fr-msg { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 20px; color: #ffbcab; min-height: 1.4em; max-width: 24ch; }
      @media (prefers-reduced-motion: reduce) { .fr-seal .fr-ticks { animation: none; } }
    </style>
  </head>
  <body>
    <div class="fr-lock" id="fr-lock" data-state="opening" role="status" aria-live="polite">
      <img class="fr-lock__tex" src="/for-rehan/paperboard.webp" alt="" aria-hidden="true" />
      <svg class="fr-seal" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="98" /><circle cx="100" cy="100" r="90" />
        <circle class="fr-ticks" cx="100" cy="100" r="94" />
        <circle cx="100" cy="100" r="58" />
        <path d="M100 111C92 105 87 100 87 94.5C87 90.5 90 88 93.5 88C96.5 88 98.8 90 100 92.5C101.2 90 103.5 88 106.5 88C110 88 113 90.5 113 94.5C113 100 108 105 100 111Z" />
      </svg>
      <p class="fr-label fr-when-opening">Opening…</p>
      <p class="fr-label fr-when-sealed">Sealed with love</p>
      <h1 class="fr-title fr-when-sealed">A private letter</h1>
      <p class="fr-line fr-when-sealed">This one opens only for Rehan.</p>
      <div class="fr-cam">
        <div class="fr-view"><video id="fr-video" playsinline muted autoplay></video></div>
        <p class="fr-msg" id="fr-msg" aria-live="polite"></p>
        <button class="fr-btn" id="fr-scan" type="button">Show me your face</button>
      </div>
    </div>
    <div id="fr-root"></div>
    <script>
      (function () {
        var html = document.documentElement;
        html.classList.add("fr-sealed");
        var lock = document.getElementById("fr-lock");
        var GAME = /\/game\/?$/.test(location.pathname);
        function sealed() { lock.setAttribute("data-state", "sealed"); }

        var m = /(?:^#|&)k=([A-Za-z0-9_-]{43})/.exec(location.hash || "");
        if (!window.crypto || !crypto.subtle) return sealed();
        if (!m) { sealed(); return faceGate(start); }
        start(m[1]);

        function faceGate(done) {
          var btn = document.getElementById("fr-scan"), msg = document.getElementById("fr-msg"), video = document.getElementById("fr-video");
          var F = "/for-rehan/face/", O = "YzgxAR9XVgQGIQQAenYZJD8mIQBAOTsHPScGXxgsNwswRkc4Fx4wHmUGag==", P = "ROSES22";
          var stream = null, timer = null, busy = false;
          function say(t) { msg.textContent = t; }
          function stop() { if (timer) clearInterval(timer); timer = null; if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
          function loadScript(src) { return new Promise(function (ok, no) { if (window.faceapi) return ok(); var sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }
          var ready = null;
          function prep() {
            if (ready) return ready;
            ready = loadScript(F + "face-api.js").then(function () {
              var fa = window.faceapi;
              return Promise.all([fa.nets.tinyFaceDetector.loadFromUri(F), fa.nets.faceLandmark68Net.loadFromUri(F), fa.nets.faceRecognitionNet.loadFromUri(F), fetch(F + "ref.json").then(function (r) { return r.json(); })]);
            }).then(function (x) { return x[3].map(function (d) { return new Float32Array(d); }); });
            ready.catch(function () { ready = null; });
            return ready;
          }
          function unwrap() { var b = atob(O), k = ""; for (var i = 0; i < b.length; i++) k += String.fromCharCode(b.charCodeAt(i) ^ P.charCodeAt(i % P.length)); return k; }
          btn.addEventListener("click", function () {
            btn.hidden = true; lock.setAttribute("data-state", "scanning"); say("Waking the camera…");
            var camP = navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 640 } }, audio: false }) : Promise.reject(new Error("nocam"));
            camP.then(function (s) { stream = s; video.srcObject = s; return video.play().catch(function () {}); }).then(function () {
              say("Getting a good look…");
              return prep();
            }).then(function (refs) {
              var fa = window.faceapi, hits = 0, tries = 0, opts = new fa.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.45 });
              say("Look straight at me.");
              timer = setInterval(function () {
                if (busy) return; busy = true; tries++;
                fa.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor().then(function (r) {
                  busy = false;
                  if (!timer) return;
                  if (!r) { if (tries > 6) say("Come a little closer, in good light."); return; }
                  var best = Math.min.apply(null, refs.map(function (d) { return fa.euclideanDistance(d, r.descriptor); }));
                  if (best < 0.55) { hits++; if (hits >= 2) { stop(); say("There you are."); var k = unwrap(); history.replaceState(null, "", location.pathname + "#k=" + k); lock.setAttribute("data-state", "opening"); setTimeout(function () { done(k); }, 600); return; } }
                  else { hits = 0; if (tries > 10) say("Hmm, you don’t look like Rehan."); }
                  if (tries > 45) { stop(); lock.setAttribute("data-state", "sealed"); say("Not this time. Try again in better light?"); btn.hidden = false; }
                }).catch(function () { busy = false; });
              }, 350);
            }).catch(function () {
              stop(); lock.setAttribute("data-state", "sealed"); btn.hidden = false;
              say("I need the camera to see who’s reading. Allow it and tap again.");
            });
          });
        }

        function start(keyB64) {

        function b64u(s) {
          s = s.replace(/-/g, "+").replace(/_/g, "/");
          while (s.length % 4) s += "=";
          var bin = atob(s), out = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
          return out;
        }
        var BASE = "/for-rehan/sealed/";
        var keyP = crypto.subtle.importKey("raw", b64u(keyB64), "AES-GCM", false, ["decrypt"]);
        function open(file) {
          return Promise.all([keyP, fetch(BASE + file).then(function (r) {
            if (!r.ok) throw new Error("fetch " + r.status);
            return r.arrayBuffer();
          })]).then(function (x) {
            var buf = new Uint8Array(x[1]);
            return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, x[0], buf.subarray(12));
          });
        }
        function urls(assets) {
          var names = Object.keys(assets), map = {};
          return Promise.all(names.map(function (n) {
            return open(assets[n].id + ".bin").then(function (b) {
              map[n] = URL.createObjectURL(new Blob([b], { type: assets[n].type }));
            });
          })).then(function () { return map; });
        }
        function mount(part, map, ctx) {
          var st = document.createElement("style");
          st.textContent = part.css;
          document.head.appendChild(st);
          document.getElementById("fr-root").outerHTML = part.html.replace(/\{\{img:([a-z0-9_]+)\}\}/g, function (_, n) { return map[n] || ""; });
          window.__FR = ctx;
          var sc = document.createElement("script");
          sc.textContent = part.js;
          document.body.appendChild(sc);
          html.classList.remove("fr-sealed");
          lock.classList.add("is-gone");
          setTimeout(function () { lock.remove(); }, 800);
        }

        var frag = "#k=" + keyB64;
        open("manifest.bin").then(function (b) {
          var man = JSON.parse(new TextDecoder().decode(b));
          var part = GAME ? man.game : man.letter;
          if (GAME) {
            document.title = "Rehan’s Dress-Up Run";
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#3a1016");
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = "https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&display=swap";
            document.head.appendChild(l);
          } else {
            document.title = "For Rehan";
          }
          return urls(part.assets).then(function (map) {
            mount(part, map, {
              assets: map,
              answer: GAME ? null : man.answer,
              gameHref: "/for-rehan/game" + frag,
              letterHref: "/for-rehan" + frag
            });
            // warm the cache for the present while he reads
            if (!GAME) setTimeout(function () {
              Object.keys(man.game.assets).forEach(function (n) { fetch(BASE + man.game.assets[n].id + ".bin").catch(function () {}); });
            }, 4000);
          });
        }).catch(function () { sealed(); });
        }
      })();
    </script>
  </body>
</html>
